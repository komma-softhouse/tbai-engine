name: TicketBai Actions
on: [push]

env:
  PHP_EXTENSIONS: gmp,curl,gd

jobs:
  tests:
    name: PHP ${{ matrix.php-version }} - ${{ matrix.test-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        test-type: ['phpstan', 'phpunit-unit']
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: ${{ env.PHP_EXTENSIONS }}
        tools: composer:v2,phpstan,phpunit
    
    - name: Cache Composer dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    
    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist
    
    - name: Run phpstan
      if: matrix.test-type == 'phpstan'
      run: phpstan analyse --configuration phpstan.neon --memory-limit 1G
    
    - name: Run phpunit (unit tests)
      if: matrix.test-type == 'phpunit-unit'
      env:
        TBAI_ARABA_APP_LICENSE: ${{ secrets.TBAI_ARABA_APP_LICENSE }}
        TBAI_ARABA_APP_DEVELOPER_NIF: ${{ secrets.TBAI_ARABA_APP_DEVELOPER_NIF }}
        TBAI_BIZKAIA_APP_DEVELOPER_NIF: ${{ secrets.TBAI_BIZKAIA_APP_DEVELOPER_NIF }}
        TBAI_BIZKAIA_ISSUER_NAME_140: ${{ secrets.TBAI_BIZKAIA_ISSUER_NAME_140 }}
        TBAI_BIZKAIA_ISSUER_NIF_140: ${{ secrets.TBAI_BIZKAIA_ISSUER_NIF_140 }}
        TBAI_BIZKAIA_ISSUER_NAME_240: ${{ secrets.TBAI_BIZKAIA_ISSUER_NAME_240 }}
        TBAI_BIZKAIA_ISSUER_NIF_240: ${{ secrets.TBAI_BIZKAIA_ISSUER_NIF_240 }}
        TBAI_GIPUZKOA_APP_LICENSE: ${{ secrets.TBAI_GIPUZKOA_APP_LICENSE }}
        TBAI_GIPUZKOA_APP_DEVELOPER_NIF: ${{ secrets.TBAI_GIPUZKOA_APP_DEVELOPER_NIF }}
        TBAI_GIPUZKOA_ISSUER_NIF: ${{ secrets.TBAI_GIPUZKOA_ISSUER_NIF }}
      run: phpunit -c phpunit.xml.dist --testsuite unit

  api-tests:
    name: PHP ${{ matrix.php-version }} - phpunit-api
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        php-version: ['8.0', '8.5']
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: ${{ env.PHP_EXTENSIONS }}
        tools: composer:v2,phpunit
    
    - name: Cache Composer dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    
    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist
    
    - name: Run phpunit (API endpoint tests)
      env:
        TBAI_ARABA_APP_LICENSE: ${{ secrets.TBAI_ARABA_APP_LICENSE }}
        TBAI_ARABA_APP_DEVELOPER_NIF: ${{ secrets.TBAI_ARABA_APP_DEVELOPER_NIF }}
        TBAI_BIZKAIA_APP_DEVELOPER_NIF: ${{ secrets.TBAI_BIZKAIA_APP_DEVELOPER_NIF }}
        TBAI_BIZKAIA_ISSUER_NAME_140: ${{ secrets.TBAI_BIZKAIA_ISSUER_NAME_140 }}
        TBAI_BIZKAIA_ISSUER_NIF_140: ${{ secrets.TBAI_BIZKAIA_ISSUER_NIF_140 }}
        TBAI_BIZKAIA_ISSUER_NAME_240: ${{ secrets.TBAI_BIZKAIA_ISSUER_NAME_240 }}
        TBAI_BIZKAIA_ISSUER_NIF_240: ${{ secrets.TBAI_BIZKAIA_ISSUER_NIF_240 }}
        TBAI_GIPUZKOA_APP_LICENSE: ${{ secrets.TBAI_GIPUZKOA_APP_LICENSE }}
        TBAI_GIPUZKOA_APP_DEVELOPER_NIF: ${{ secrets.TBAI_GIPUZKOA_APP_DEVELOPER_NIF }}
        TBAI_GIPUZKOA_ISSUER_NIF: ${{ secrets.TBAI_GIPUZKOA_ISSUER_NIF }}
      run: phpunit -c phpunit.xml.dist --testsuite api